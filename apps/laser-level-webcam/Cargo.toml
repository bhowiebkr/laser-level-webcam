[package]
name = "laser-level-webcam"
description = "Straightness and flatness from a laser line on a lensless webcam, as a window or in the browser."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "laser-level-webcam"
path = "src/main.rs"

[dependencies]
laser-core.workspace = true
laser-camera.workspace = true
eframe = { version = "=0.37.0", features = ["persistence"] }
serde.workspace = true
serde_json.workspace = true
rfd = "0.17"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "Url", "Window"] }

[lints]
workspace = true
