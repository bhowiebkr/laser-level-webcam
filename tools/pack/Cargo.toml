[package]
name = "pack"
description = "Builds the release files: the app icon and installer pictures, and the browser version as one HTML file, and checks that file in Chrome."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pack"
path = "src/main.rs"

[dependencies]
flate2 = "1.1"
png = "0.18"
serde_json.workspace = true
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }

[lints]
workspace = true
