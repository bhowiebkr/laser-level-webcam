[package]
name = "browser-check"
description = "Checks the browser camera and its controls in a real browser: builds the check page, serves it, opens it in Chrome and reports what passed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "browser-check"
path = "src/main.rs"

[target.'cfg(target_arch = "wasm32")'.dependencies]
laser-core.workspace = true
laser-camera.workspace = true
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "Location",
    "MediaStreamTrack",
    "MediaStreamTrackState",
    "Node",
    "NodeList",
    "UrlSearchParams",
    "Window",
    "XmlHttpRequest",
] }

[lints]
workspace = true
