[package]
name = "laser-camera"
description = "Cameras for the laser level webcam: the luma plane straight from the camera, with its controls locked for measuring."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
laser-core.workspace = true
zune-jpeg = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["exception"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
objc2-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutputBase",
    "AVCaptureSession", "AVCaptureVideoDataOutput", "AVMediaFormat",
    "block2", "dispatch2", "objc2-core-media", "objc2-core-video",
] }
objc2-core-media = { version = "0.3", default-features = false, features = [
    "std", "CMFormatDescription", "CMSampleBuffer", "CMTime", "objc2-core-video",
] }
objc2-core-video = { version = "0.3", default-features = false, features = [
    "std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_Devices_Usb",
    "Win32_Foundation",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlMediaElement",
    "HtmlVideoElement",
    "ImageData",
    "MediaDeviceInfo",
    "MediaDeviceKind",
    "MediaDevices",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "MediaStreamTrackState",
    "MediaTrackConstraints",
    "Navigator",
    "Node",
    "Window",
] }

[lints]
workspace = true
